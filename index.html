<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iridescent Prism — Project Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar__logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
          <path d="M3 9L7 3H17L21 9L12 21L3 9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M3 9H21M7 3L12 9L17 3M12 9V21" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span>Iridescent Prism</span>
      </div>
      <div id="sidebar-nav" class="sidebar__nav"></div>
      <p class="sidebar__section-label">Projects</p>
      <nav class="sidebar__projects" id="sidebar-projects"></nav>
      <button class="sidebar__new-project" id="btn-new-project">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
          <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
        </svg>
        New Project
      </button>
    </aside>

    <main id="main">
      <header id="board-header">
        <button class="hamburger" id="btn-hamburger" aria-label="Toggle sidebar">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" width="20" height="20">
            <line x1="3" y1="5" x2="17" y2="5"/>
            <line x1="3" y1="10" x2="17" y2="10"/>
            <line x1="3" y1="15" x2="17" y2="15"/>
          </svg>
        </button>
        <div id="project-title-area">
          <h1 id="project-title">Iridescent Prism</h1>
        </div>
        <button class="btn-primary hidden" id="btn-add-task">+ Add Task</button>
      </header>
      <div id="board-wrapper">
        <div id="board"></div>
      </div>
    </main>
  </div>

  <div id="modal-overlay">
    <div id="modal-box"></div>
  </div>

  <div id="sidebar-backdrop"></div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.local.js" onerror="void 0"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
